<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trái Tim Pháo Hoa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(45deg, #0a0a0a, #1a1a2e, #16213e);
            overflow: hidden;
            height: 100vh;
            font-family: 'Arial', sans-serif;
        }

        #fireworks-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .heart-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            animation: heartBeat 2s ease-in-out infinite;
        }

        .heart {
            width: 300px;
            height: 270px;
            position: relative;
            transform: rotate(-45deg);
            background: linear-gradient(45deg, #ff6b6b, #ff8e8e, #ffa8a8);
            border-radius: 50px 50px 0 50px;
            box-shadow: 
                0 0 50px rgba(255, 107, 107, 0.8),
                inset 0 0 50px rgba(255, 255, 255, 0.2);
            animation: heartGlow 3s ease-in-out infinite alternate;
        }

        .heart:before,
        .heart:after {
            content: '';
            width: 150px;
            height: 240px;
            position: absolute;
            left: 150px;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
            border-radius: 150px 150px 0 0;
            background: linear-gradient(45deg, #ff6b6b, #ff8e8e, #ffa8a8);
            box-shadow: inset 0 0 30px rgba(255, 255, 255, 0.2);
        }

        .heart:after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }

        .heart-image {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(45deg);
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: url('./images/NghiaVaTuyen.png') center/cover;
            border: 5px solid rgba(255, 255, 255, 0.8);
            box-shadow: 
                0 0 30px rgba(255, 255, 255, 0.6),
                inset 0 0 20px rgba(0, 0, 0, 0.2);
            animation: imageFloat 4s ease-in-out infinite;
            z-index: 3;
        }

        .floating-hearts {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .floating-heart {
            position: absolute;
            color: #ff6b6b;
            font-size: 20px;
            animation: floatUp 6s linear infinite;
            opacity: 0;
        }

        .sparkles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #ffd700;
            border-radius: 50%;
            animation: sparkle 2s linear infinite;
        }

        @keyframes heartBeat {
            0%, 50%, 100% {
                transform: translate(-50%, -50%) scale(1);
            }
            25%, 75% {
                transform: translate(-50%, -50%) scale(1.1);
            }
        }

        @keyframes heartGlow {
            0% {
                box-shadow: 
                    0 0 50px rgba(255, 107, 107, 0.8),
                    inset 0 0 50px rgba(255, 255, 255, 0.2);
            }
            100% {
                box-shadow: 
                    0 0 80px rgba(255, 107, 107, 1),
                    0 0 120px rgba(255, 107, 107, 0.6),
                    inset 0 0 50px rgba(255, 255, 255, 0.3);
            }
        }

        @keyframes imageFloat {
            0%, 100% {
                transform: translate(-50%, -50%) rotate(45deg) translateY(0px);
            }
            50% {
                transform: translate(-50%, -50%) rotate(45deg) translateY(-10px);
            }
        }

        @keyframes floatUp {
            0% {
                opacity: 0;
                transform: translateY(0px) rotate(0deg);
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translateY(-100vh) rotate(360deg);
            }
        }

        @keyframes sparkle {
            0%, 100% {
                opacity: 0;
                transform: scale(0);
            }
            50% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .title {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 3rem;
            text-align: center;
            z-index: 3;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            animation: titleGlow 2s ease-in-out infinite alternate;
        }

        @keyframes titleGlow {
            0% {
                text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            }
            100% {
                text-shadow: 
                    0 0 30px rgba(255, 255, 255, 1),
                    0 0 40px rgba(255, 107, 107, 0.8);
            }
        }

        .music-note {
            position: absolute;
            color: #ffd700;
            font-size: 24px;
            animation: musicFloat 8s linear infinite;
            z-index: 2;
        }

        @keyframes musicFloat {
            0% {
                opacity: 0;
                transform: translateY(100vh) rotate(0deg);
            }
            10%, 90% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translateY(-20px) rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <canvas id="fireworks-canvas"></canvas>
    
    <div class="title">Hữu Nghĩa 💕 Phương Tuyến</div>
    
    <div class="heart-container">
        <div class="heart">
            <div class="heart-image">
            </div>
        </div>
    </div>

    <div class="floating-hearts" id="floating-hearts"></div>
    <div class="sparkles" id="sparkles"></div>

    <!-- Thư viện pháo hoa -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // Tạo pháo hoa với Canvas
        const canvas = document.getElementById('fireworks-canvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        class Particle {
            constructor(x, y, color, velocity) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.velocity = velocity;
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.01;
                this.gravity = 0.1;
            }

            update() {
                this.velocity.x *= 0.99;
                this.velocity.y *= 0.99;
                this.velocity.y += this.gravity;
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        class Firework {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.particles = [];
                this.colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', '#feca57', '#ff9ff3', '#54a0ff'];
                
                // Tạo nhiều hạt cho hiệu ứng đẹp hơn
                for (let i = 0; i < 30; i++) {
                    const angle = (Math.PI * 2 * i) / 30;
                    const velocity = {
                        x: Math.cos(angle) * (Math.random() * 6 + 2),
                        y: Math.sin(angle) * (Math.random() * 6 + 2)
                    };
                    const color = this.colors[Math.floor(Math.random() * this.colors.length)];
                    this.particles.push(new Particle(x, y, color, velocity));
                }
            }

            update() {
                this.particles.forEach(particle => particle.update());
                this.particles = this.particles.filter(particle => particle.alpha > 0);
            }

            draw() {
                this.particles.forEach(particle => particle.draw());
            }
        }

        let fireworks = [];

        function createFirework() {
            const x = Math.random() * canvas.width;
            const y = Math.random() * canvas.height * 0.7;
            fireworks.push(new Firework(x, y));
        }

        function animate() {
            ctx.fillStyle = 'rgba(10, 10, 10, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            fireworks.forEach(firework => {
                firework.update();
                firework.draw();
            });
            
            fireworks = fireworks.filter(firework => firework.particles.length > 0);
            
            // Tạo pháo hoa ngẫu nhiên
            if (Math.random() < 0.05) {
                createFirework();
            }
            
            requestAnimationFrame(animate);
        }

        animate();

        // Tạo trái tim bay
        function createFloatingHeart() {
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.innerHTML = '💖';
            heart.style.left = Math.random() * 100 + '%';
            heart.style.animationDelay = Math.random() * 2 + 's';
            heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
            document.getElementById('floating-hearts').appendChild(heart);
            
            setTimeout(() => {
                heart.remove();
            }, 6000);
        }

        // Tạo ngôi sao lấp lánh
        function createSparkle() {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.style.left = Math.random() * 100 + '%';
            sparkle.style.top = Math.random() * 100 + '%';
            sparkle.style.animationDelay = Math.random() * 2 + 's';
            document.getElementById('sparkles').appendChild(sparkle);
            
            setTimeout(() => {
                sparkle.remove();
            }, 2000);
        }

        // Tạo nốt nhạc bay
        function createMusicNote() {
            const notes = ['♪', '♫', '♬', '♭', '♮', '♯'];
            const note = document.createElement('div');
            note.className = 'music-note';
            note.innerHTML = notes[Math.floor(Math.random() * notes.length)];
            note.style.left = Math.random() * 100 + '%';
            note.style.animationDelay = Math.random() * 3 + 's';
            document.body.appendChild(note);
            
            setTimeout(() => {
                note.remove();
            }, 8000);
        }

        // Tạo hiệu ứng liên tục
        setInterval(createFloatingHeart, 1000);
        setInterval(createSparkle, 200);
        setInterval(createMusicNote, 2000);

        // Tạo pháo hoa khi click
        canvas.addEventListener('click', (e) => {
            fireworks.push(new Firework(e.clientX, e.clientY));
        });

        // Tự động tạo pháo hoa lớn mỗi 3 giây
        setInterval(() => {
            for (let i = 0; i < 3; i++) {
                setTimeout(() => {
                    createFirework();
                }, i * 200);
            }
        }, 3000);

        // Responsive
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Tạo hiệu ứng cực quang
        function createAurora() {
            const aurora = document.createElement('div');
            aurora.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: linear-gradient(45deg, 
                    transparent 30%, 
                    rgba(64, 224, 208, 0.1) 40%, 
                    rgba(255, 107, 107, 0.1) 60%, 
                    transparent 70%);
                animation: aurora 10s ease-in-out infinite;
                pointer-events: none;
                z-index: 1;
            `;
            
            const style = document.createElement('style');
            style.textContent = `
                @keyframes aurora {
                    0%, 100% { transform: translateX(-100%); }
                    50% { transform: translateX(100%); }
                }
            `;
            document.head.appendChild(style);
            document.body.appendChild(aurora);
        }

        createAurora();
    </script>
</body>
</html>
