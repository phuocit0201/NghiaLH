<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pháo Hoa Trái Tim</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(45deg, #0a0a0a, #1a1a2e, #16213e);
            overflow: hidden;
            height: 100vh;
            font-family: 'Arial', sans-serif;
        }

        #fireworks-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #heart-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        .title {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 3rem;
            text-align: center;
            z-index: 3;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            animation: titleGlow 2s ease-in-out infinite alternate;
            opacity: 0;
        }

        @keyframes titleGlow {
            0% {
                text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            }
            100% {
                text-shadow: 
                    0 0 30px rgba(255, 255, 255, 1),
                    0 0 40px rgba(255, 107, 107, 0.8);
            }
        }

        .launch-trail {
            position: absolute;
            width: 4px;
            height: 20px;
            background: linear-gradient(to top, #ff6b6b, #ffd700);
            border-radius: 2px;
            box-shadow: 0 0 10px #ff6b6b;
        }

        .heart-text {
            text-align: center;
            width: 300px;
            position: absolute;
            top: 42%;
            left: 50%;
            transform: translateX(-50%);
            color: #ff1493;
            font-size: 2.5rem;
            font-weight: bold;
            text-shadow: 
                0 0 10px #ff1493,
                0 0 20px #ff1493,
                0 0 30px #ff1493;
            animation: heartTextGlow 2s ease-in-out infinite alternate;
            z-index: 3;
            opacity: 0;
        }

        @keyframes heartTextGlow {
            0% {
                text-shadow: 
                    0 0 10px #ff1493,
                    0 0 20px #ff1493,
                    0 0 30px #ff1493;
            }
            100% {
                text-shadow: 
                    0 0 15px #ff1493,
                    0 0 25px #ff1493,
                    0 0 35px #ff1493,
                    0 0 45px #ff1493;
            }
        }

        .floating-hearts {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .floating-heart {
            position: absolute;
            color: #ff6b6b;
            font-size: 20px;
            animation: floatUp 6s linear infinite;
            opacity: 0;
        }

        @keyframes floatUp {
            0% {
                opacity: 0;
                transform: translateY(0px) rotate(0deg);
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translateY(-100vh) rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <canvas id="fireworks-canvas"></canvas>
    <canvas id="heart-canvas"></canvas>
    
    
    <div class="heart-text">I Love You HTKH</div>
    <div class="floating-hearts" id="floating-hearts"></div>

    <script>
        // Canvas setup
        const canvas = document.getElementById('fireworks-canvas');
        const ctx = canvas.getContext('2d');
        const heartCanvas = document.getElementById('heart-canvas');
        const heartCtx = heartCanvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        heartCanvas.width = window.innerWidth;
        heartCanvas.height = window.innerHeight;

        let animationStarted = false;
        let heartAnimationStarted = false;
        let stars = [];

        // Star class cho background
        class Star {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.opacity = Math.random();
                this.twinkleSpeed = Math.random() * 0.02 + 0.01;
                this.color = this.getRandomStarColor();
            }

            getRandomStarColor() {
                const colors = ['#ffffff', '#ffffaa', '#aaaaff', '#ffaaaa', '#aaffaa'];
                return colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.opacity += this.twinkleSpeed;
                if (this.opacity >= 1 || this.opacity <= 0.1) {
                    this.twinkleSpeed = -this.twinkleSpeed;
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;
                
                // Draw star shape
                ctx.beginPath();
                for (let i = 0; i < 5; i++) {
                    const angle = (i * Math.PI * 2) / 5 - Math.PI / 2;
                    const outerRadius = this.size;
                    const innerRadius = this.size * 0.5;
                    
                    if (i === 0) {
                        ctx.moveTo(
                            this.x + Math.cos(angle) * outerRadius,
                            this.y + Math.sin(angle) * outerRadius
                        );
                    } else {
                        ctx.lineTo(
                            this.x + Math.cos(angle) * outerRadius,
                            this.y + Math.sin(angle) * outerRadius
                        );
                    }
                    
                    const innerAngle = angle + Math.PI / 5;
                    ctx.lineTo(
                        this.x + Math.cos(innerAngle) * innerRadius,
                        this.y + Math.sin(innerAngle) * innerRadius
                    );
                }
                ctx.closePath();
                ctx.fill();
                
                // Add glow effect
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
                
                ctx.restore();
            }
        }

        // Particle class cho pháo hoa thường
        class Particle {
            constructor(x, y, color, velocity) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.velocity = velocity;
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.01;
                this.gravity = 0.1;
            }

            update() {
                this.velocity.x *= 0.99;
                this.velocity.y *= 0.99;
                this.velocity.y += this.gravity;
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        // Firework class
        class Firework {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.particles = [];
                this.colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', '#feca57', '#ff9ff3', '#54a0ff'];
                
                for (let i = 0; i < 30; i++) {
                    const angle = (Math.PI * 2 * i) / 30;
                    const velocity = {
                        x: Math.cos(angle) * (Math.random() * 6 + 2),
                        y: Math.sin(angle) * (Math.random() * 6 + 2)
                    };
                    const color = this.colors[Math.floor(Math.random() * this.colors.length)];
                    this.particles.push(new Particle(x, y, color, velocity));
                }
            }

            update() {
                this.particles.forEach(particle => particle.update());
                this.particles = this.particles.filter(particle => particle.alpha > 0);
            }

            draw() {
                this.particles.forEach(particle => particle.draw());
            }
        }

        // Launch trail class
        class LaunchTrail {
            constructor() {
                this.x = canvas.width / 2;
                this.y = canvas.height;
                this.targetY = canvas.height / 2;
                this.speed = 8;
                this.particles = [];
                this.active = true;
            }

            update() {
                if (this.active) {
                    this.y -= this.speed;
                    
                    // Tạo trail particles
                    for (let i = 0; i < 3; i++) {
                        this.particles.push({
                            x: this.x + (Math.random() - 0.5) * 4,
                            y: this.y + Math.random() * 20,
                            alpha: 1,
                            decay: 0.02,
                            color: `hsl(${Math.random() * 60 + 10}, 100%, 60%)`
                        });
                    }

                    // Check if reached target
                    if (this.y <= this.targetY) {
                        this.active = false;
                        this.explode();
                    }
                }

                // Update trail particles
                this.particles = this.particles.filter(particle => {
                    particle.alpha -= particle.decay;
                    return particle.alpha > 0;
                });
            }

            draw() {
                // Draw main trail
                if (this.active) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffd700';
                    ctx.fill();
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#ffd700';
                    ctx.restore();
                }

                // Draw trail particles
                this.particles.forEach(particle => {
                    ctx.save();
                    ctx.globalAlpha = particle.alpha;
                    ctx.beginPath();
                    ctx.arc(particle.x, particle.y, 2, 0, Math.PI * 2);
                    ctx.fillStyle = particle.color;
                    ctx.fill();
                    ctx.restore();
                });
            }

                         explode() {
                 // Tạo hiệu ứng tỏa ra và bắt đầu trái tim đồng thời
                 this.createBurstEffect();
                 
                 // Bắt đầu heart animation ngay lập tức khi tỏa ra
                 setTimeout(() => {
                     startHeartAnimation();
                 }, 200);
                 
                 // Show title and text after delay
                 setTimeout(() => {
                     document.querySelector('.title').style.opacity = '1';
                     document.querySelector('.title').style.animation = 'titleGlow 2s ease-in-out infinite alternate';
                 }, 600);

                 setTimeout(() => {
                     document.querySelector('.heart-text').style.opacity = '1';
                     document.querySelector('.heart-text').style.animation = 'heartTextGlow 2s ease-in-out infinite alternate';
                 }, 1000);

                 // Start floating hearts
                 setTimeout(() => {
                     setInterval(createFloatingHeart, 800);
                 }, 1400);

                 // Start regular fireworks
                 setTimeout(() => {
                     setInterval(createFirework, 2000);
                 }, 1800);
             }

             createBurstEffect() {
                 // Tạo hiệu ứng flash sáng trước
                 window.flashIntensity = 1;
                 
                 // Giảm dần flash
                 const flashInterval = setInterval(() => {
                     window.flashIntensity -= 0.05;
                     if (window.flashIntensity <= 0) {
                         window.flashIntensity = 0;
                         clearInterval(flashInterval);
                     }
                 }, 16);

                 // Tạo hiệu ứng tỏa tròn trước khi thành trái tim
                 const burstParticles = [];
                 const burstColors = ['#ffd700', '#ff6b6b', '#ff9ff3', '#54a0ff', '#feca57', '#ff1493'];
                 
                 // Tạo 80 particles tỏa ra theo hình tròn với nhiều layers
                 for (let layer = 0; layer < 3; layer++) {
                     for (let i = 0; i < 30; i++) {
                         const angle = (Math.PI * 2 * i) / 30 + (layer * 0.1);
                         const speed = Math.random() * 10 + 6 + (layer * 2);
                         burstParticles.push({
                             x: this.x,
                             y: this.targetY,
                             vx: Math.cos(angle) * speed,
                             vy: Math.sin(angle) * speed,
                             alpha: 1,
                             decay: 0.012 + (layer * 0.003),
                             size: Math.random() * 5 + 2 + layer,
                             color: burstColors[Math.floor(Math.random() * burstColors.length)],
                             trail: []
                         });
                     }
                 }

                 // Thêm particles vào để animate
                 window.burstParticles = burstParticles;
                 window.burstActive = true;

                 // Tắt burst effect sau 800ms
                 setTimeout(() => {
                     window.burstActive = false;
                 }, 800);
             }
        }

        // Heart animation classes
        class HeartParticle {
            constructor() {
                this.position = {x: 0, y: 0};
                this.velocity = {x: 0, y: 0};
                this.acceleration = {x: 0, y: 0};
                this.age = 0;
            }

            initialize(x, y, dx, dy) {
                this.position.x = x;
                this.position.y = y;
                this.velocity.x = dx;
                this.velocity.y = dy;
                this.acceleration.x = dx * -0.75;
                this.acceleration.y = dy * -0.75;
                this.age = 0;
            }

            update(deltaTime) {
                this.position.x += this.velocity.x * deltaTime;
                this.position.y += this.velocity.y * deltaTime;
                this.velocity.x += this.acceleration.x * deltaTime;
                this.velocity.y += this.acceleration.y * deltaTime;
                this.age += deltaTime;
            }

            draw(context, image) {
                function ease(t) {
                    return (--t) * t * t + 1;
                }
                var size = image.width * ease(this.age / 2);
                context.globalAlpha = 1 - this.age / 2;
                context.drawImage(image, this.position.x - size / 2, this.position.y - size / 2, size, size);
            }
        }

        // Heart particle pool
        class HeartParticlePool {
            constructor(length) {
                this.particles = new Array(length);
                for (var i = 0; i < this.particles.length; i++) {
                    this.particles[i] = new HeartParticle();
                }
                this.firstActive = 0;
                this.firstFree = 0;
                this.duration = 2;
            }

            add(x, y, dx, dy) {
                this.particles[this.firstFree].initialize(x, y, dx, dy);
                this.firstFree++;
                if (this.firstFree == this.particles.length) this.firstFree = 0;
                if (this.firstActive == this.firstFree) this.firstActive++;
                if (this.firstActive == this.particles.length) this.firstActive = 0;
            }

            update(deltaTime) {
                var i;
                if (this.firstActive < this.firstFree) {
                    for (i = this.firstActive; i < this.firstFree; i++)
                        this.particles[i].update(deltaTime);
                }
                if (this.firstFree < this.firstActive) {
                    for (i = this.firstActive; i < this.particles.length; i++)
                        this.particles[i].update(deltaTime);
                    for (i = 0; i < this.firstFree; i++)
                        this.particles[i].update(deltaTime);
                }
                while (this.particles[this.firstActive].age >= this.duration && this.firstActive != this.firstFree) {
                    this.firstActive++;
                    if (this.firstActive == this.particles.length) this.firstActive = 0;
                }
            }

            draw(context, image) {
                if (this.firstActive < this.firstFree) {
                    for (var i = this.firstActive; i < this.firstFree; i++)
                        this.particles[i].draw(context, image);
                }
                if (this.firstFree < this.firstActive) {
                    for (var i = this.firstActive; i < this.particles.length; i++)
                        this.particles[i].draw(context, image);
                    for (var i = 0; i < this.firstFree; i++)
                        this.particles[i].draw(context, image);
                }
            }
        }

        // Heart animation variables
        let heartParticles;
        let heartImage;
        let heartTime;

        function pointOnHeart(t) {
            return {
                x: 160 * Math.pow(Math.sin(t), 3),
                y: 130 * Math.cos(t) - 50 * Math.cos(2 * t) - 20 * Math.cos(3 * t) - 10 * Math.cos(4 * t) + 25
            };
        }

        function createHeartImage() {
            var canvas = document.createElement('canvas');
            var context = canvas.getContext('2d');
            canvas.width = 30;
            canvas.height = 30;

            function to(t) {
                var point = pointOnHeart(t);
                point.x = 15 + point.x * 15 / 350;
                point.y = 15 - point.y * 15 / 350;
                return point;
            }

            context.beginPath();
            var t = -Math.PI;
            var point = to(t);
            context.moveTo(point.x, point.y);
            while (t < Math.PI) {
                t += 0.01;
                point = to(t);
                context.lineTo(point.x, point.y);
            }
            context.closePath();
            context.fillStyle = '#ff1493';
            context.fill();

            var image = new Image();
            image.src = canvas.toDataURL();
            return image;
        }

        function startHeartAnimation() {
            heartParticles = new HeartParticlePool(300);
            heartImage = createHeartImage();
            heartTime = new Date().getTime() / 1000;
            heartAnimationStarted = true;
        }

        // Initialize stars
        function createStars() {
            stars = [];
            for (let i = 0; i < 100; i++) {
                stars.push(new Star());
            }
        }

        // Main animation variables
        let fireworks = [];
        let launchTrail = new LaunchTrail();

                 function animate() {
             // Clear canvas
             ctx.fillStyle = 'rgba(10, 10, 10, 0.1)';
             ctx.fillRect(0, 0, canvas.width, canvas.height);
             
             heartCtx.clearRect(0, 0, heartCanvas.width, heartCanvas.height);

             // Update and draw stars
             stars.forEach(star => {
                 star.update();
                 star.draw();
             });

             // Update and draw launch trail
             if (launchTrail.active || launchTrail.particles.length > 0) {
                 launchTrail.update();
                 launchTrail.draw();
             }

             // Draw flash effect
             if (window.flashIntensity > 0) {
                 ctx.save();
                 ctx.globalAlpha = window.flashIntensity * 0.8;
                 ctx.fillStyle = '#ffffff';
                 ctx.fillRect(0, 0, canvas.width, canvas.height);
                 ctx.restore();
             }

             // Update and draw burst effect
             if (window.burstActive && window.burstParticles) {
                 window.burstParticles.forEach((particle, index) => {
                     // Add to trail
                     particle.trail.push({x: particle.x, y: particle.y, alpha: particle.alpha});
                     if (particle.trail.length > 8) {
                         particle.trail.shift();
                     }

                     // Update particle
                     particle.x += particle.vx;
                     particle.y += particle.vy;
                     particle.vy += 0.08; // gravity
                     particle.vx *= 0.99; // air resistance
                     particle.vy *= 0.99;
                     particle.alpha -= particle.decay;

                     // Draw trail
                     particle.trail.forEach((trailPoint, trailIndex) => {
                         ctx.save();
                         ctx.globalAlpha = trailPoint.alpha * (trailIndex / particle.trail.length) * 0.5;
                         ctx.beginPath();
                         ctx.arc(trailPoint.x, trailPoint.y, particle.size * 0.3, 0, Math.PI * 2);
                         ctx.fillStyle = particle.color;
                         ctx.fill();
                         ctx.restore();
                     });

                     // Draw main particle
                     ctx.save();
                     ctx.globalAlpha = particle.alpha;
                     ctx.beginPath();
                     ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                     ctx.fillStyle = particle.color;
                     ctx.fill();
                     ctx.shadowBlur = 20;
                     ctx.shadowColor = particle.color;
                     ctx.restore();

                     // Remove dead particles
                     if (particle.alpha <= 0) {
                         window.burstParticles.splice(index, 1);
                     }
                 });
             }

            // Update and draw heart animation
            if (heartAnimationStarted) {
                var newTime = new Date().getTime() / 1000;
                var deltaTime = newTime - heartTime;
                heartTime = newTime;

                var amount = 150 * deltaTime;
                for (var i = 0; i < amount; i++) {
                    var pos = pointOnHeart(Math.PI - 2 * Math.PI * Math.random());
                    var dir = {
                        x: pos.x,
                        y: pos.y
                    };
                    var length = Math.sqrt(dir.x * dir.x + dir.y * dir.y);
                    dir.x /= length;
                    dir.y /= length;
                    dir.x *= 100;
                    dir.y *= 100;
                    heartParticles.add(heartCanvas.width / 2 + pos.x, heartCanvas.height / 2 - pos.y, dir.x, -dir.y);
                }

                heartParticles.update(deltaTime);
                heartParticles.draw(heartCtx, heartImage);
            }

            // Update and draw regular fireworks
            fireworks.forEach(firework => {
                firework.update();
                firework.draw();
            });
            fireworks = fireworks.filter(firework => firework.particles.length > 0);

            // Random fireworks
            if (Math.random() < 0.02 && heartAnimationStarted) {
                createFirework();
            }

            requestAnimationFrame(animate);
        }

        function createFirework() {
            const x = Math.random() * canvas.width;
            const y = Math.random() * canvas.height * 0.7;
            fireworks.push(new Firework(x, y));
        }

        function createFloatingHeart() {
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.innerHTML = '💖';
            heart.style.left = Math.random() * 100 + '%';
            heart.style.animationDelay = Math.random() * 2 + 's';
            heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
            document.getElementById('floating-hearts').appendChild(heart);
            
            setTimeout(() => {
                heart.remove();
            }, 6000);
        }

        // Responsive
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            heartCanvas.width = window.innerWidth;
            heartCanvas.height = window.innerHeight;
            // Recreate stars for new canvas size
            createStars();
        });

        // Initialize and start animation
        createStars();
        animate();
    </script>
</body>
</html>
